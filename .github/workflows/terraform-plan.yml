name: Terraform plan

on:
  pull_request:
    paths:
      - "terraform/**"

env:
  TF_VERSION:   "1.7.0"
  WORKING_DIR:  "terraform"

jobs:
  detect-environment:
    name: Detect target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Set environment from branch name
        id: env
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" == *"prod"* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == *"staging"* ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  opa-policy-check:
    name: OPA policy check
    runs-on: ubuntu-latest
    needs: detect-environment
    env:
      TF_ENV: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="environments/${{ env.TF_ENV }}.tfvars" \
            -out=plan.tfplan
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Convert plan to JSON
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform show -json plan.tfplan > plan.json

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.46.0/conftest_0.46.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.46.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run OPA policy check
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          conftest test plan.json \
            --policy ../policies/ \
            --namespace cost \
            --output github

  infracost:
    name: Infracost — cost estimation
    runs-on: ubuntu-latest
    needs: [detect-environment, opa-policy-check]
    env:
      TF_ENV: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost estimate
        run: |
          infracost breakdown \
            --path=${{ env.WORKING_DIR }} \
            --terraform-var-file=${{ env.WORKING_DIR }}/environments/${{ env.TF_ENV }}.tfvars \
            --format=json \
            --out-file=/tmp/infracost.json
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Post cost comment on PR
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behavior: update
          # Block PR if monthly cost increase exceeds $500
          threshold-percentage: 20

  ai-cost-review:
    name: AI cost review
    runs-on: ubuntu-latest
    needs: [detect-environment, opa-policy-check]
    env:
      TF_ENV: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform plan to JSON
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="environments/${{ env.TF_ENV }}.tfvars" \
            -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run AI cost review
        run: |
          python scripts/ai/iac_review.py \
            --plan-file terraform/plan.json \
            --pr-number ${{ github.event.pull_request.number }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
